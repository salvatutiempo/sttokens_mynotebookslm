<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Terminal descargando los modelos locales para el RAG">
  <defs>
    <filter id="rt-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5c5648" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>
  <path d="M150 130 a90 90 0 1 0 30 70" fill="none" stroke="#ddd2bd" stroke-width="8" stroke-linecap="round" opacity="0.45"/>

  <rect x="96" y="72" width="1088" height="576" rx="20" fill="#3f3c35" stroke="#524d44" stroke-width="1.2" filter="url(#rt-sh)"/>
  <circle cx="132" cy="108" r="6" fill="#bf7e63"/>
  <circle cx="156" cy="108" r="6" fill="#c7a35e"/>
  <circle cx="180" cy="108" r="6" fill="#93a17d"/>
  <text x="216" y="114" fill="#8f897c" font-family="'Courier New', monospace" font-size="16">salvatustokens — indexar documentos</text>
  <line x1="96" y1="132" x2="1184" y2="132" stroke="#4b463d" stroke-width="1.2"/>

  <g font-family="'Courier New', monospace" font-size="19">
    <text x="132" y="176" fill="#9bb07f">$</text>
    <text x="156" y="176" fill="#e7e0cf">ollama pull llama3.2:3b</text>
    <rect x="156" y="194" width="280" height="11" rx="5.5" fill="#4b463d"/>
    <rect x="156" y="194" width="280" height="11" rx="5.5" fill="#9bb07f"/>
    <rect x="156" y="194" width="52" height="11" rx="5.5" fill="#c4d3a8"><animate attributeName="x" values="156;384;156" dur="3s" repeatCount="indefinite"/></rect>
    <text x="456" y="204" fill="#9bb07f">2.0 GB</text>

    <text x="132" y="246" fill="#9bb07f">$</text>
    <text x="156" y="246" fill="#e7e0cf">ollama pull nomic-embed-text</text>
    <rect x="156" y="264" width="280" height="11" rx="5.5" fill="#4b463d"/>
    <rect x="156" y="264" width="280" height="11" rx="5.5" fill="#9bb07f"/>
    <rect x="156" y="264" width="52" height="11" rx="5.5" fill="#c4d3a8"><animate attributeName="x" values="156;384;156" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="456" y="274" fill="#9bb07f">274 MB</text>

    <text x="132" y="324" fill="#9bb07f">$</text>
    <text x="156" y="324" fill="#e7e0cf">python indexar.py ./documentos</text>
    <text x="156" y="362" fill="#cda06f">Leídos 18 archivos · 642 trozos</text>
    <text x="156" y="396" fill="#cda06f">Embeddings generados en local: 642/642</text>
    <text x="156" y="430" fill="#9bb07f">Índice guardado en ./db_local  ✓</text>

    <text x="132" y="498" fill="#9bb07f">$</text>
    <text x="156" y="498" fill="#e7e0cf">python preguntar.py</text>

    <rect x="132" y="528" width="900" height="44" rx="10" fill="#34322c"/>
    <text x="156" y="556" fill="#b9b3a3">&gt; ¿Cuántos días de preaviso pide el contrato?</text>

    <text x="132" y="616" fill="#cda06f">&gt;&gt;&gt;</text>
    <rect x="170" y="601" width="12" height="20" fill="#e7e0cf"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
