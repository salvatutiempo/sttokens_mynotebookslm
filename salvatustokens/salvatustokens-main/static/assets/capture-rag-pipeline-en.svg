<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Pipeline of a local RAG with your own documents">
  <defs>
    <filter id="rp-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#7a7264" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>
  <path d="M1180 110 a92 92 0 1 0 30 72" fill="none" stroke="#ddd2bd" stroke-width="9" stroke-linecap="round" opacity="0.4"/>

  <text x="80" y="104" fill="#4a463f" font-family="Georgia, 'Times New Roman', serif" font-size="38">How a local RAG works</text>
  <line x1="82" y1="124" x2="240" y2="124" stroke="#b98b6e" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <g font-size="15">
      <rect x="80" y="172" width="262" height="120" rx="14" fill="#f5f0e6" stroke="#dcd3c2" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="120" cy="208" r="15" fill="#efe2d6" stroke="#cdb59f" stroke-width="1.3"/>
      <text x="120" y="213" fill="#a06a4d" font-family="Georgia, serif" font-size="16" text-anchor="middle">1</text>
      <text x="146" y="214" fill="#4a463f" font-size="18" font-weight="600">Documents</text>
      <text x="104" y="252" fill="#8a8273">PDF, Word, notes,</text>
      <text x="104" y="272" fill="#8a8273">contracts, manuals</text>

      <rect x="366" y="172" width="262" height="120" rx="14" fill="#eef0e4" stroke="#d3d8c2" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="406" cy="208" r="15" fill="#dfe6cf" stroke="#9aa97f" stroke-width="1.3"/>
      <text x="406" y="213" fill="#5f6e48" font-family="Georgia, serif" font-size="16" text-anchor="middle">2</text>
      <text x="432" y="214" fill="#4a463f" font-size="18" font-weight="600">Chunks</text>
      <text x="390" y="252" fill="#8a8273">Split into chunks</text>
      <text x="390" y="272" fill="#8a8273">of a stable size</text>

      <rect x="652" y="172" width="262" height="120" rx="14" fill="#eef0e4" stroke="#d3d8c2" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="692" cy="208" r="15" fill="#dfe6cf" stroke="#9aa97f" stroke-width="1.3"/>
      <text x="692" y="213" fill="#5f6e48" font-family="Georgia, serif" font-size="16" text-anchor="middle">3</text>
      <text x="718" y="214" fill="#4a463f" font-size="18" font-weight="600">Embeddings</text>
      <text x="676" y="252" fill="#8a8273">Vectors locally</text>
      <text x="676" y="272" fill="#8a8273">with nomic-embed</text>

      <rect x="938" y="172" width="262" height="120" rx="14" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="978" cy="208" r="15" fill="#f1e8d2" stroke="#d2bd8f" stroke-width="1.3"/>
      <text x="978" y="213" fill="#8a6a2e" font-family="Georgia, serif" font-size="16" text-anchor="middle">4</text>
      <text x="1004" y="214" fill="#4a463f" font-size="18" font-weight="600">Index</text>
      <text x="962" y="252" fill="#8a8273">Vector store</text>
      <text x="962" y="272" fill="#8a8273">on your disk</text>
    </g>

    <g stroke="#cabfa9" stroke-width="1.5">
      <line x1="342" y1="232" x2="366" y2="232"/>
      <line x1="628" y1="232" x2="652" y2="232"/>
      <line x1="914" y1="232" x2="938" y2="232"/>
    </g>
    <circle r="3.5" fill="#93a17d"><animateMotion path="M342 232 H366" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#93a17d"><animateMotion path="M628 232 H652" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#c7a35e"><animateMotion path="M914 232 H938" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>

    <path d="M1069 292 V332 H211 V372" fill="none" stroke="#cabfa9" stroke-width="1.5"/>
    <circle r="3.5" fill="#b98b6e"><animateMotion path="M1069 292 V332 H211 V372" dur="3.4s" repeatCount="indefinite"/></circle>

    <g font-size="15">
      <rect x="80" y="372" width="262" height="120" rx="14" fill="#f0e6d9" stroke="#e0d2c0" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="120" cy="408" r="15" fill="#efe2d6" stroke="#cdb59f" stroke-width="1.3"/>
      <text x="120" y="413" fill="#a06a4d" font-family="Georgia, serif" font-size="16" text-anchor="middle">5</text>
      <text x="146" y="414" fill="#4a463f" font-size="18" font-weight="600">Question</text>
      <text x="104" y="452" fill="#8a8273">"What does the</text>
      <text x="104" y="472" fill="#8a8273">contract say about X?"</text>

      <rect x="366" y="372" width="262" height="120" rx="14" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="406" cy="408" r="15" fill="#f1e8d2" stroke="#d2bd8f" stroke-width="1.3"/>
      <text x="406" y="413" fill="#8a6a2e" font-family="Georgia, serif" font-size="16" text-anchor="middle">6</text>
      <text x="432" y="414" fill="#4a463f" font-size="18" font-weight="600">Retrieve</text>
      <text x="390" y="452" fill="#8a8273">Only the 4 most</text>
      <text x="390" y="472" fill="#8a8273">relevant chunks</text>

      <rect x="652" y="372" width="262" height="120" rx="14" fill="#eef0e4" stroke="#d3d8c2" stroke-width="1.2" filter="url(#rp-sh)"/>
      <circle cx="692" cy="408" r="15" fill="#dfe6cf" stroke="#9aa97f" stroke-width="1.3"/>
      <text x="692" y="413" fill="#5f6e48" font-family="Georgia, serif" font-size="16" text-anchor="middle">7</text>
      <text x="718" y="414" fill="#4a463f" font-size="18" font-weight="600">Local model</text>
      <text x="676" y="452" fill="#8a8273">Answers with that</text>
      <text x="676" y="472" fill="#8a8273">trimmed context</text>

      <rect x="938" y="372" width="262" height="120" rx="14" fill="#3f3c35" filter="url(#rp-sh)"/>
      <circle cx="978" cy="408" r="15" fill="none" stroke="#9bb07f" stroke-width="1.5"/>
      <text x="978" y="413" fill="#9bb07f" font-family="Georgia, serif" font-size="16" text-anchor="middle">8</text>
      <text x="1004" y="414" fill="#f0ead9" font-size="18" font-weight="600">Answer</text>
      <text x="962" y="452" fill="#b9b3a3">With its sources</text>
      <text x="962" y="472" fill="#b9b3a3">and zero API tokens</text>
    </g>

    <g stroke="#cabfa9" stroke-width="1.5">
      <line x1="342" y1="432" x2="366" y2="432"/>
      <line x1="628" y1="432" x2="652" y2="432"/>
      <line x1="914" y1="432" x2="938" y2="432"/>
    </g>
    <circle r="3.5" fill="#b98b6e"><animateMotion path="M342 432 H366" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#c7a35e"><animateMotion path="M628 432 H652" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#93a17d"><animateMotion path="M914 432 H938" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="80" y="540" width="1120" height="60" rx="14" fill="#efe6d2" stroke="#e0d4ba" stroke-width="1.2"/>
  <circle cx="112" cy="570" r="5" fill="#93a17d"><animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/></circle>
  <text x="130" y="576" fill="#7a6231" font-family="Georgia, serif" font-size="17">Your documents never leave your machine · no cost per token · works offline</text>
</svg>
