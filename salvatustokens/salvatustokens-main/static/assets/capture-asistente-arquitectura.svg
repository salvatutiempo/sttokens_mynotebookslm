<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Arquitectura de un asistente de IA que corre entero en tu equipo, sin nube">
  <defs>
    <filter id="zsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#7a7264" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#ece4d6"/>
  <!-- motivo enso muy tenue -->
  <path d="M1180 150 a118 118 0 1 0 40 90" fill="none" stroke="#d8cdb9" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <text x="80" y="118" fill="#4a463f" font-family="Georgia, 'Times New Roman', serif" font-size="40">Tu asistente vive en tu equipo</text>
  <line x1="82" y1="138" x2="250" y2="138" stroke="#b98b6e" stroke-width="2"/>
  <text x="82" y="170" fill="#8a8273" font-family="Georgia, serif" font-size="18" font-style="italic">Nada sale a internet · todo se procesa en local</text>

  <!-- panel equipo -->
  <rect x="80" y="200" width="770" height="446" rx="18" fill="#f5f0e6" stroke="#dcd3c2" stroke-width="1.2" filter="url(#zsh)"/>
  <circle cx="112" cy="240" r="5" fill="#93a17d">
    <animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="128" y="246" fill="#6f7d5c" font-family="Georgia, serif" font-size="19">Tu portátil / mini PC</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Ollama -->
    <rect x="112" y="278" width="220" height="124" rx="14" fill="#efe8da" stroke="#dcd3c2" stroke-width="1.2"/>
    <circle cx="148" cy="318" r="13" fill="none" stroke="#b98b6e" stroke-width="2"/>
    <circle cx="148" cy="318" r="4" fill="#b98b6e"/>
    <text x="172" y="324" fill="#4a463f" font-size="19" font-weight="600">Ollama</text>
    <text x="136" y="356" fill="#8a8273" font-size="14.5">El motor que corre</text>
    <text x="136" y="378" fill="#8a8273" font-size="14.5">los modelos</text>

    <!-- Qwen -->
    <rect x="360" y="278" width="210" height="124" rx="14" fill="#eef0e4" stroke="#d3d8c2" stroke-width="1.2"/>
    <circle cx="396" cy="318" r="13" fill="none" stroke="#93a17d" stroke-width="2"/>
    <circle cx="396" cy="318" r="4" fill="#93a17d"/>
    <text x="420" y="324" fill="#4a463f" font-size="19" font-weight="600">Qwen 3</text>
    <text x="384" y="356" fill="#8a8273" font-size="14.5">Piensa y</text>
    <text x="384" y="378" fill="#8a8273" font-size="14.5">responde</text>

    <!-- Open WebUI -->
    <rect x="598" y="278" width="220" height="124" rx="14" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2"/>
    <circle cx="634" cy="318" r="13" fill="none" stroke="#c7a35e" stroke-width="2"/>
    <circle cx="634" cy="318" r="4" fill="#c7a35e"/>
    <text x="658" y="324" fill="#4a463f" font-size="19" font-weight="600">Open WebUI</text>
    <text x="622" y="356" fill="#8a8273" font-size="14.5">La interfaz de chat</text>
    <text x="622" y="378" fill="#8a8273" font-size="14.5">en tu navegador</text>

    <!-- conectores finos con punto que deriva lento -->
    <line x1="332" y1="340" x2="360" y2="340" stroke="#cabfa9" stroke-width="1.5"/>
    <line x1="570" y1="340" x2="598" y2="340" stroke="#cabfa9" stroke-width="1.5"/>
    <circle r="3.5" fill="#93a17d">
      <animateMotion path="M332 340 H360" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#c7a35e">
      <animateMotion path="M570 340 H598" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <!-- API line -->
    <rect x="112" y="430" width="706" height="64" rx="14" fill="#3f3c35"/>
    <circle cx="140" cy="462" r="4.5" fill="#9bb07f"/>
    <text x="158" y="468" fill="#e3dccb" font-family="'Courier New', monospace" font-size="16">API local · localhost:11434 → tus scripts</text>

    <!-- privacidad -->
    <rect x="112" y="518" width="706" height="64" rx="14" fill="#efe6d2" stroke="#e0d4ba" stroke-width="1.2"/>
    <text x="136" y="557" fill="#7a6231" font-family="Georgia, serif" font-size="17">Tus datos no salen de aquí · 0&#8201;€ · sin internet</text>
  </g>

  <!-- nube descartada -->
  <rect x="930" y="232" width="252" height="130" rx="16" fill="#efe8da" stroke="#dcd3c2" stroke-width="1.2"/>
  <text x="1056" y="276" fill="#9a8478" font-family="Georgia, serif" font-size="18" text-anchor="middle">Nube de pago</text>
  <text x="1056" y="306" fill="#a99e8d" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">coste por token</text>
  <text x="1056" y="328" fill="#a99e8d" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">tus datos salen fuera</text>
  <line x1="948" y1="248" x2="1164" y2="346" stroke="#bf7e63" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </line>
  <text x="1056" y="392" fill="#a06a4d" font-family="Georgia, serif" font-size="16" font-style="italic" text-anchor="middle">ya no la necesitas</text>

  <!-- checklist -->
  <g font-family="Georgia, serif" font-size="20" fill="#4a463f">
    <g>
      <circle cx="942" cy="438" r="11" fill="none" stroke="#93a17d" stroke-width="1.8"/>
      <path d="M937 438 l4 4 6 -8" fill="none" stroke="#6f7d5c" stroke-width="2"/>
      <text x="966" y="444">Privado<animate attributeName="opacity" values="0.45;1;0.45" dur="5s" begin="0s" repeatCount="indefinite"/></text>
    </g>
    <g>
      <circle cx="942" cy="478" r="11" fill="none" stroke="#93a17d" stroke-width="1.8"/>
      <path d="M937 478 l4 4 6 -8" fill="none" stroke="#6f7d5c" stroke-width="2"/>
      <text x="966" y="484">Gratis<animate attributeName="opacity" values="0.45;1;0.45" dur="5s" begin="0.8s" repeatCount="indefinite"/></text>
    </g>
    <g>
      <circle cx="942" cy="518" r="11" fill="none" stroke="#93a17d" stroke-width="1.8"/>
      <path d="M937 518 l4 4 6 -8" fill="none" stroke="#6f7d5c" stroke-width="2"/>
      <text x="966" y="524">Sin límites<animate attributeName="opacity" values="0.45;1;0.45" dur="5s" begin="1.6s" repeatCount="indefinite"/></text>
    </g>
    <g>
      <circle cx="942" cy="558" r="11" fill="none" stroke="#93a17d" stroke-width="1.8"/>
      <path d="M937 558 l4 4 6 -8" fill="none" stroke="#6f7d5c" stroke-width="2"/>
      <text x="966" y="564">Funciona offline<animate attributeName="opacity" values="0.45;1;0.45" dur="5s" begin="2.4s" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
