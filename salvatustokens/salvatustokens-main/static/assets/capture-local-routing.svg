<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Pipeline para repartir tareas entre IA local e IA de pago">
  <defs>
    <filter id="lr-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#7a7264" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>
  <path d="M1180 110 a92 92 0 1 0 30 72" fill="none" stroke="#ddd2bd" stroke-width="9" stroke-linecap="round" opacity="0.4"/>

  <text x="80" y="112" fill="#4a463f" font-family="Georgia, 'Times New Roman', serif" font-size="38">Pipeline de ahorro</text>
  <line x1="82" y1="132" x2="220" y2="132" stroke="#b98b6e" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- entrada -->
    <rect x="80" y="190" width="250" height="132" rx="14" fill="#f0e6d9" stroke="#e0d2c0" stroke-width="1.2" filter="url(#lr-sh)"/>
    <circle cx="118" cy="228" r="14" fill="#efe2d6" stroke="#cdb59f" stroke-width="1.3"/>
    <text x="118" y="233" fill="#a06a4d" font-family="Georgia, serif" font-size="15" text-anchor="middle">1</text>
    <text x="144" y="234" fill="#4a463f" font-size="19" font-weight="600">Entrada</text>
    <text x="104" y="278" fill="#8a8273" font-size="15">Logs, tickets,</text>
    <text x="104" y="300" fill="#8a8273" font-size="15">notas</text>

    <!-- IA local -->
    <rect x="370" y="190" width="250" height="132" rx="14" fill="#eef0e4" stroke="#d3d8c2" stroke-width="1.2" filter="url(#lr-sh)"/>
    <circle cx="408" cy="228" r="14" fill="#dfe6cf" stroke="#9aa97f" stroke-width="1.3"/>
    <text x="408" y="233" fill="#5f6e48" font-family="Georgia, serif" font-size="15" text-anchor="middle">2</text>
    <text x="434" y="234" fill="#4a463f" font-size="19" font-weight="600">IA local</text>
    <text x="394" y="278" fill="#8a8273" font-size="15">Clasifica</text>
    <text x="394" y="300" fill="#8a8273" font-size="15">y resume</text>

    <!-- IA de pago -->
    <rect x="660" y="190" width="250" height="132" rx="14" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2" filter="url(#lr-sh)"/>
    <circle cx="698" cy="228" r="14" fill="#f1e8d2" stroke="#d2bd8f" stroke-width="1.3"/>
    <text x="698" y="233" fill="#8a6a2e" font-family="Georgia, serif" font-size="15" text-anchor="middle">3</text>
    <text x="724" y="234" fill="#4a463f" font-size="19" font-weight="600">IA de pago</text>
    <text x="684" y="278" fill="#8a8273" font-size="15">Razona</text>
    <text x="684" y="300" fill="#8a8273" font-size="15">y redacta</text>

    <!-- salida -->
    <rect x="950" y="190" width="250" height="132" rx="14" fill="#3f3c35" filter="url(#lr-sh)"/>
    <circle cx="988" cy="228" r="14" fill="none" stroke="#9bb07f" stroke-width="1.4"/>
    <text x="988" y="233" fill="#9bb07f" font-family="Georgia, serif" font-size="15" text-anchor="middle">4</text>
    <text x="1014" y="234" fill="#f0ead9" font-size="19" font-weight="600">Salida</text>
    <text x="974" y="278" fill="#b9b3a3" font-size="15">Menos coste,</text>
    <text x="974" y="300" fill="#b9b3a3" font-size="15">misma calidad</text>

    <g stroke="#cabfa9" stroke-width="1.5">
      <line x1="330" y1="256" x2="370" y2="256"/>
      <line x1="620" y1="256" x2="660" y2="256"/>
      <line x1="910" y1="256" x2="950" y2="256"/>
    </g>
    <circle r="3.5" fill="#93a17d"><animateMotion path="M330 256 H370" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#c7a35e"><animateMotion path="M620 256 H660" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#b98b6e"><animateMotion path="M910 256 H950" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- panel resultado -->
  <rect x="80" y="382" width="1120" height="210" rx="18" fill="#3f3c35" filter="url(#lr-sh)"/>
  <g font-family="'Courier New', monospace">
    <text x="116" y="428" fill="#cda06f" font-size="18">resultado</text>
    <text x="116" y="474" fill="#e7e0cf" font-size="22">tokens_antes   = 3.600.000</text>
    <text x="116" y="514" fill="#e7e0cf" font-size="22">tokens_despues = 2.180.000</text>
    <text x="116" y="554" fill="#9bb07f" font-size="22">ahorro = 39,4 %</text>
    <rect x="760" y="430" width="404" height="14" rx="7" fill="#4b463d"/>
    <rect x="760" y="430" width="245" height="14" rx="7" fill="#9bb07f"><animate attributeName="width" values="245;250;245" dur="4s" repeatCount="indefinite"/></rect>
    <text x="760" y="478" fill="#8f897c" font-size="15">— 39,4 % menos tokens al modelo de pago</text>
  </g>
</svg>
