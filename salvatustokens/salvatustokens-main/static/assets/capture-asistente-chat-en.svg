<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="ChatGPT-style chat interface running locally with Open WebUI">
  <defs>
    <filter id="zsh4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5c5648" flood-opacity="0.16"/>
    </filter>
    <filter id="zsoft4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7a7264" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>

  <rect x="56" y="48" width="1168" height="624" rx="20" fill="#f6f1e8" stroke="#dcd3c2" stroke-width="1.2" filter="url(#zsh4)"/>
  <rect x="56" y="48" width="1168" height="54" rx="20" fill="#efe8da"/>
  <rect x="56" y="84" width="1168" height="18" fill="#efe8da"/>
  <circle cx="88" cy="75" r="6" fill="#bf7e63"/>
  <circle cx="112" cy="75" r="6" fill="#c7a35e"/>
  <circle cx="136" cy="75" r="6" fill="#93a17d"/>
  <text x="176" y="81" fill="#9a9182" font-family="'Courier New', monospace" font-size="15">localhost:3000 — your private ChatGPT</text>
  <line x1="56" y1="102" x2="1224" y2="102" stroke="#dcd3c2" stroke-width="1.2"/>

  <line x1="336" y1="102" x2="336" y2="672" stroke="#dcd3c2" stroke-width="1.2"/>
  <rect x="80" y="128" width="232" height="46" rx="14" fill="#93a17d"/>
  <text x="108" y="157" fill="#f5f2e8" font-family="Georgia, serif" font-size="17">+ New chat</text>
  <g font-family="'Courier New', monospace" font-size="14.5">
    <rect x="80" y="196" width="232" height="40" rx="12" fill="#efe8da" stroke="#dcd3c2" stroke-width="1"/>
    <text x="98" y="221" fill="#5f594d">draft client email</text>
    <text x="98" y="266" fill="#9a9182">monday meeting summary</text>
    <text x="98" y="308" fill="#9a9182">refactor python function</text>
    <text x="98" y="350" fill="#9a9182">linkedin post ideas</text>
  </g>
  <circle cx="92" cy="632" r="5" fill="#93a17d">
    <animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="106" y="638" fill="#8a8273" font-family="'Courier New', monospace" font-size="14">qwen3:8b · 100% local</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="700" y="132" width="500" height="58" rx="18" fill="#f0e6d9" stroke="#e0d2c0" stroke-width="1.2"/>
    <text x="724" y="168" fill="#5f594d" font-size="18">Write me an email to postpone a meeting</text>

    <rect x="368" y="222" width="660" height="232" rx="18" fill="#f9f5ec" stroke="#dcd3c2" stroke-width="1.2" filter="url(#zsoft4)"/>
    <rect x="392" y="244" width="116" height="30" rx="15" fill="#eef0e4" stroke="#c2cdac" stroke-width="1"/>
    <text x="450" y="264" fill="#6f7d5c" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">qwen3:8b</text>
    <text x="392" y="308" fill="#4a463f" font-size="18" font-weight="600">Subject: Rescheduling our meeting</text>
    <text x="392" y="342" fill="#6b665c" font-size="18">Hi [Name], I'm writing to suggest moving our</text>
    <text x="392" y="376" fill="#6b665c" font-size="18">Thursday meeting to next week. Something came</text>
    <text x="392" y="410" fill="#6b665c" font-size="18">up and I want to give you the time you deserve.</text>
    <text x="392" y="444" fill="#6b665c" font-size="18">Does Tuesday at 10am work for you?</text>

    <rect x="368" y="600" width="788" height="52" rx="26" fill="#f6f1e8" stroke="#d6cab5" stroke-width="1.2"/>
    <text x="396" y="632" fill="#a99e8d" font-size="17">Type a message… (free, no token limit)</text>
    <circle cx="1130" cy="626" r="22" fill="#c7a35e">
      <animate attributeName="opacity" values="1;0.7;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M1122 634 l14 -8 -14 -8 4 8 z" fill="#f5f2e8"/>
  </g>
</svg>
