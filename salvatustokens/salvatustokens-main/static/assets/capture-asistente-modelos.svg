<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Qué modelo de IA local elegir según la RAM de tu equipo">
  <defs>
    <filter id="zsh3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#7a7264" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>
  <path d="M1170 110 a96 96 0 1 0 32 74" fill="none" stroke="#ddd2bd" stroke-width="9" stroke-linecap="round" opacity="0.4"/>

  <text x="80" y="104" fill="#4a463f" font-family="Georgia, 'Times New Roman', serif" font-size="38">Elige tu modelo según la RAM</text>
  <line x1="82" y1="124" x2="240" y2="124" stroke="#b98b6e" stroke-width="2"/>
  <text x="82" y="156" fill="#8a8273" font-family="Georgia, serif" font-size="17" font-style="italic">El mejor modelo es el que vuela en tu equipo · junio 2026</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- 8GB -->
    <rect x="80" y="186" width="1120" height="118" rx="16" fill="#f5f0e6" stroke="#dcd3c2" stroke-width="1.2" filter="url(#zsh3)"/>
    <circle cx="160" cy="245" r="40" fill="#efe2d6" stroke="#cdb59f" stroke-width="1.5"/>
    <text x="160" y="240" fill="#a06a4d" font-family="Georgia, serif" font-size="26" text-anchor="middle">8</text>
    <text x="160" y="262" fill="#a06a4d" font-size="13" text-anchor="middle">GB</text>
    <text x="232" y="236" fill="#4a463f" font-size="21" font-weight="600">Portátil normal</text>
    <text x="232" y="266" fill="#8a8273" font-size="15">Resúmenes · clasificar · reescribir · día a día</text>
    <rect x="772" y="222" width="170" height="40" rx="20" fill="#efe8da" stroke="#d6cab5" stroke-width="1.2"/>
    <text x="857" y="248" fill="#7a6a52" font-family="'Courier New', monospace" font-size="15" text-anchor="middle">qwen3:4b</text>
    <rect x="958" y="222" width="186" height="40" rx="20" fill="#efe8da" stroke="#d6cab5" stroke-width="1.2"/>
    <text x="1051" y="248" fill="#7a6a52" font-family="'Courier New', monospace" font-size="15" text-anchor="middle">gemma3:4b</text>

    <!-- 16GB destacada -->
    <rect x="80" y="320" width="1120" height="128" rx="16" fill="#eef0e4" stroke="#b9c5a2" stroke-width="1.6" filter="url(#zsh3)"/>
    <circle cx="160" cy="384" r="44" fill="#dfe6cf" stroke="#9aa97f" stroke-width="1.5"/>
    <circle cx="160" cy="384" r="44" fill="none" stroke="#93a17d" stroke-width="1.5">
      <animate attributeName="r" values="44;48;44" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <text x="160" y="378" fill="#5f6e48" font-family="Georgia, serif" font-size="30" text-anchor="middle">16</text>
    <text x="160" y="400" fill="#5f6e48" font-size="13" text-anchor="middle">GB</text>
    <text x="232" y="356" fill="#6f7d5c" font-family="Georgia, serif" font-size="14" font-style="italic" letter-spacing="2">— EL PUNTO DULCE —</text>
    <text x="232" y="390" fill="#4a463f" font-size="22" font-weight="600">Asistente general + código</text>
    <text x="232" y="420" fill="#8a8273" font-size="15">Si solo instalas uno, instala este</text>
    <rect x="772" y="362" width="190" height="44" rx="22" fill="#93a17d"/>
    <text x="867" y="390" fill="#f5f2e8" font-family="'Courier New', monospace" font-size="17" text-anchor="middle">qwen3:8b</text>
    <text x="980" y="382" fill="#8a8273" font-family="'Courier New', monospace" font-size="13">+razona:</text>
    <text x="980" y="402" fill="#8a8273" font-family="'Courier New', monospace" font-size="13">deepseek-r1:8b</text>

    <!-- 32GB -->
    <rect x="80" y="464" width="1120" height="118" rx="16" fill="#f5f0e6" stroke="#dcd3c2" stroke-width="1.2" filter="url(#zsh3)"/>
    <circle cx="160" cy="523" r="40" fill="#f1e8d2" stroke="#d2bd8f" stroke-width="1.5"/>
    <text x="160" y="518" fill="#8a6a2e" font-family="Georgia, serif" font-size="24" text-anchor="middle">32</text>
    <text x="160" y="540" fill="#8a6a2e" font-size="13" text-anchor="middle">GB+</text>
    <text x="232" y="514" fill="#4a463f" font-size="21" font-weight="600">Mini PC IA / Mac</text>
    <text x="232" y="544" fill="#8a8273" font-size="15">Razonamiento serio · RAG · servicio a un equipo</text>
    <rect x="772" y="500" width="170" height="40" rx="20" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2"/>
    <text x="857" y="526" fill="#8a6d31" font-family="'Courier New', monospace" font-size="15" text-anchor="middle">qwen3:32b</text>
    <rect x="958" y="500" width="186" height="40" rx="20" fill="#f3ecda" stroke="#e0d4ba" stroke-width="1.2"/>
    <text x="1051" y="526" fill="#8a6d31" font-family="'Courier New', monospace" font-size="15" text-anchor="middle">gemma4:27b</text>
  </g>
</svg>
