<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Respuesta del RAG local citando los documentos de origen">
  <defs>
    <filter id="ra-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5c5648" flood-opacity="0.16"/>
    </filter>
    <filter id="ra-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7a7264" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>

  <rect x="56" y="48" width="1168" height="624" rx="20" fill="#f6f1e8" stroke="#dcd3c2" stroke-width="1.2" filter="url(#ra-sh)"/>
  <rect x="56" y="48" width="1168" height="54" rx="20" fill="#efe8da"/>
  <rect x="56" y="84" width="1168" height="18" fill="#efe8da"/>
  <circle cx="88" cy="75" r="6" fill="#bf7e63"/>
  <circle cx="112" cy="75" r="6" fill="#c7a35e"/>
  <circle cx="136" cy="75" r="6" fill="#93a17d"/>
  <text x="176" y="81" fill="#9a9182" font-family="'Courier New', monospace" font-size="15">asistente-local · chat con tus documentos</text>
  <line x1="56" y1="102" x2="1224" y2="102" stroke="#dcd3c2" stroke-width="1.2"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- pregunta -->
    <rect x="640" y="138" width="544" height="66" rx="18" fill="#f0e6d9" stroke="#e0d2c0" stroke-width="1.2"/>
    <text x="664" y="170" fill="#5f594d" font-size="18">¿Cuántos días de preaviso pide el contrato</text>
    <text x="664" y="194" fill="#5f594d" font-size="18">de alquiler?</text>

    <!-- respuesta -->
    <rect x="80" y="236" width="800" height="236" rx="18" fill="#f9f5ec" stroke="#dcd3c2" stroke-width="1.2" filter="url(#ra-soft)"/>
    <rect x="104" y="258" width="240" height="30" rx="15" fill="#eef0e4" stroke="#c2cdac" stroke-width="1"/>
    <circle cx="122" cy="273" r="4" fill="#93a17d"><animate attributeName="opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <text x="136" y="278" fill="#6f7d5c" font-family="'Courier New', monospace" font-size="13">asistente local · llama3.2:3b</text>
    <text x="104" y="320" fill="#4a463f" font-size="18">Según el contrato, el inquilino debe avisar con</text>
    <text x="104" y="350" fill="#4a463f" font-size="18">un mínimo de <tspan font-weight="700">30 días naturales</tspan> antes de dejar la</text>
    <text x="104" y="380" fill="#4a463f" font-size="18">vivienda. Si no se respeta ese plazo, se pierde</text>
    <text x="104" y="410" fill="#4a463f" font-size="18">parte de la fianza según la cláusula séptima.</text>
    <text x="104" y="448" fill="#a99e8d" font-family="Georgia, serif" font-size="14" font-style="italic">Respondido sin enviar nada a internet · 0 tokens de pago</text>

    <!-- fuentes -->
    <rect x="80" y="510" width="1104" height="116" rx="16" fill="#efe6d2" stroke="#e0d4ba" stroke-width="1.2"/>
    <text x="104" y="546" fill="#7a6231" font-family="Georgia, serif" font-size="17">Fuentes citadas</text>
    <text x="104" y="580" fill="#6b665c" font-family="'Courier New', monospace" font-size="15">[1] contrato-alquiler.pdf · pág. 3 · cláusula 7</text>
    <text x="104" y="606" fill="#6b665c" font-family="'Courier New', monospace" font-size="15">[2] anexo-fianza.pdf · pág. 1</text>
  </g>
</svg>
