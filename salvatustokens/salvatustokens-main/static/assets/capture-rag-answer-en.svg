<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Local RAG answer citing the source documents">
  <defs>
    <filter id="ra-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5c5648" flood-opacity="0.16"/>
    </filter>
    <filter id="ra-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7a7264" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ece4d6"/>

  <rect x="56" y="48" width="1168" height="624" rx="20" fill="#f6f1e8" stroke="#dcd3c2" stroke-width="1.2" filter="url(#ra-sh)"/>
  <rect x="56" y="48" width="1168" height="54" rx="20" fill="#efe8da"/>
  <rect x="56" y="84" width="1168" height="18" fill="#efe8da"/>
  <circle cx="88" cy="75" r="6" fill="#bf7e63"/>
  <circle cx="112" cy="75" r="6" fill="#c7a35e"/>
  <circle cx="136" cy="75" r="6" fill="#93a17d"/>
  <text x="176" y="81" fill="#9a9182" font-family="'Courier New', monospace" font-size="15">local-assistant · chat with your documents</text>
  <line x1="56" y1="102" x2="1224" y2="102" stroke="#dcd3c2" stroke-width="1.2"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="640" y="138" width="544" height="66" rx="18" fill="#f0e6d9" stroke="#e0d2c0" stroke-width="1.2"/>
    <text x="664" y="170" fill="#5f594d" font-size="18">How many days' notice does the rental</text>
    <text x="664" y="194" fill="#5f594d" font-size="18">contract require?</text>

    <rect x="80" y="236" width="800" height="236" rx="18" fill="#f9f5ec" stroke="#dcd3c2" stroke-width="1.2" filter="url(#ra-soft)"/>
    <rect x="104" y="258" width="252" height="30" rx="15" fill="#eef0e4" stroke="#c2cdac" stroke-width="1"/>
    <circle cx="122" cy="273" r="4" fill="#93a17d"><animate attributeName="opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <text x="136" y="278" fill="#6f7d5c" font-family="'Courier New', monospace" font-size="13">local assistant · llama3.2:3b</text>
    <text x="104" y="320" fill="#4a463f" font-size="18">According to the contract, the tenant must give</text>
    <text x="104" y="350" fill="#4a463f" font-size="18">at least <tspan font-weight="700">30 calendar days' notice</tspan> before leaving</text>
    <text x="104" y="380" fill="#4a463f" font-size="18">the property. If that period isn't respected, part</text>
    <text x="104" y="410" fill="#4a463f" font-size="18">of the deposit is lost under clause seven.</text>
    <text x="104" y="448" fill="#a99e8d" font-family="Georgia, serif" font-size="14" font-style="italic">Answered without sending anything to the internet · 0 paid tokens</text>

    <rect x="80" y="510" width="1104" height="116" rx="16" fill="#efe6d2" stroke="#e0d4ba" stroke-width="1.2"/>
    <text x="104" y="546" fill="#7a6231" font-family="Georgia, serif" font-size="17">Cited sources</text>
    <text x="104" y="580" fill="#6b665c" font-family="'Courier New', monospace" font-size="15">[1] rental-contract.pdf · p. 3 · clause 7</text>
    <text x="104" y="606" fill="#6b665c" font-family="'Courier New', monospace" font-size="15">[2] deposit-annex.pdf · p. 1</text>
  </g>
</svg>
