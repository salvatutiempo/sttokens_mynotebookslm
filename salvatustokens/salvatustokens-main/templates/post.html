$nav
<main>
  <article class="article">
    <header class="article__header" data-animate>
      <div class="article__meta">
        <span>$post_date</span>
        <span>$post_reading_time</span>
        <span>$post_author</span>
      </div>
      <h1>$post_title</h1>
      <p>$post_subtitle</p>
      <div class="article__tags">$post_tags</div>
    </header>
    <div class="article__body">
      $post_content
    </div>
    <aside class="article-cta" data-animate>
      <h2>$article_cta_title</h2>
      <p>$article_cta_text</p>
      <a class="button button--primary" href="$guide_path">$article_cta_button</a>
    </aside>
  </article>
</main>
